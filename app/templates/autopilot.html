{% extends "base.html" %}
{% block title %}Daily autopilot · Cueframe{% endblock %}
{% block body %}
<main class="mx-auto max-w-6xl px-4 py-8">
  <div class="flex flex-wrap items-end gap-4">
    <div class="min-w-0 flex-1">
      <h1 class="text-2xl font-semibold tracking-tight">Daily trending autopilot</h1>
      <p id="ap-when" class="mt-1 text-sm text-zinc-400">Every day Cueframe makes an influencer video about the top trending GitHub repo and AI paper. Review them here before posting.</p>
    </div>
    <button id="ap-run" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500 disabled:opacity-50">Make today's videos now</button>
  </div>
  <p id="ap-note" class="mt-3 hidden text-sm text-zinc-400"></p>
  <div id="ap-list" class="mt-6 grid gap-6 md:grid-cols-2"></div>
  <p id="ap-empty" class="mt-10 hidden text-center text-sm text-zinc-500">No autopilot videos yet.</p>
</main>
<script src="/static/js/autopilot.js"></script>
{% endblock %}

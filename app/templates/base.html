<!doctype html>
<html lang="en" class="dark {% block html_class %}{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cueframe{% endblock %}</title>
  <meta name="description" content="Cueframe learns real software by doing the task in a sandbox, records every verified step, and turns it into a personalised tutorial video.">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-full{% endblock %} bg-zinc-950 font-sans text-zinc-100 antialiased">
  {% include "_nav.html" %}
  {% block body %}{% endblock %}
</body>
</html>
